<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuHealth</title>
    <meta
      name="description"
      content="DocuHealth unifies Nigeria’s healthcare ecosystem, giving patients secure, lifelong access to medical records powered by the Health Identification Number (HIN) linked with the National Identity Number (NIN)."
    />
    <script>
      // Apply the saved theme before first paint (no light flash). Mirrors src/stores/theme-store.ts.
      try {
        const theme = JSON.parse(localStorage.getItem("theme") ?? "{}").state?.theme ?? "system";
        const dark =
          theme === "dark" ||
          (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
